[package]
name = "preset-preferences"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Typed, versioned TOML preferences for the preset.nz desktop apps: schema with defaults, validated load, atomic save, Tauri commands and change event."
repository = "https://github.com/preset-nz/preferences"
readme = "README.md"
keywords = ["preferences", "settings", "tauri", "toml"]
categories = ["config", "gui"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[lib]
name = "preset_preferences"

[features]
default = []
tauri = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tauri = { version = "2", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
