# Releases: `just release`. Bumps package.json from the conventional commits
# since the last tag, writes CHANGELOG.md, rescans the licence lock, commits and
# tags. Pushing and publishing stay manual (guidance runbooks/publish-npm-package.md).

[package]
versioned_files = ["package.json"]
changelog = "CHANGELOG.md"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Command"
command = "just check"

[[workflows.steps]]
type = "PrepareRelease"

# knope writes package.json without a trailing newline, which Biome rejects;
# the licence lock hashes the lockfile, so a bump can make it stale.
[[workflows.steps]]
type = "Command"
command = "./node_modules/.bin/biome format --write package.json && preset-compliance licences scan && git add package.json preset-compliance.lock"
shell = true

[[workflows.steps]]
type = "Command"
command = "git commit -m \"release: $version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Release"
