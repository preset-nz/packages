[package]
name = "rhizome-pom"
version = "0.1.6"
description = "POM, the Preset Object Model: the app-unaware base every app's object model is built on. Documents, kinds and their policy, presets, commands, projections."
edition = "2024"
license = "MIT"
repository = "https://github.com/preset-nz/rhizome"
readme = "../../README.md"

[dependencies]
rhizome-core = { path = "../rhizome-core", version = "0.1.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
