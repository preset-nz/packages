[package]
name = "rhizome-core"
version = "0.1.6"
description = "The node API the preset.nz desktop apps share: paths, node types, values, references, groups, bindings, orders, edits with undo, diff and a file format."
edition = "2024"
license = "MIT"
repository = "https://github.com/preset-nz/rhizome"
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
ulid = "1"
