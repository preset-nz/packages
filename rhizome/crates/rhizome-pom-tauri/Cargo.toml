[package]
name = "rhizome-pom-tauri"
version = "0.1.6"
description = "POM over Tauri: one open document as app-level commands and events, and the opened-from-Finder hand-off. Commands only; the webview never writes the tree."
edition = "2024"
license = "MIT"
repository = "https://github.com/preset-nz/rhizome"
readme = "../../README.md"

[dependencies]
rhizome-pom = { path = "../rhizome-pom", version = "0.1.6" }
serde_json = "1"
tauri = { version = "2", default-features = false }

[dev-dependencies]
rhizome-core = { path = "../rhizome-core", version = "0.1.6" }
tauri = { version = "2", default-features = false, features = ["test"] }
