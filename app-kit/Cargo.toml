[package]
name = "preset-app-kit"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "The behaviour of a preset.nz desktop app: one command table feeding the native menu and the toolbar, Undo and Redo that say what they undo, text-field undo routing, and saving with the unsaved mark and the close guard."
repository = "https://github.com/preset-nz/packages"
readme = "README.md"
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[lib]
name = "preset_app_kit"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
toml = "0.9"
# The `models` feature: streamed SHA-256 and a small blocking HTTP client (no async runtime).
sha2 = { version = "0.10", optional = true }
# ureq's `rustls` feature bundles webpki-roots (CDLA-Permissive-2.0, outside the permissive policy),
# so TLS is the OS's own stack via native-tls (Security.framework, SChannel, OpenSSL).
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"], optional = true }

[features]
default = []
models = ["dep:sha2", "dep:ureq"]

[dev-dependencies]
tempfile = "3"
