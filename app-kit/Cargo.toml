[package]
name = "preset-app-kit"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "The behaviour of a preset.nz desktop app: one command table feeding the native menu and the toolbar, Undo and Redo that say what they undo, text-field undo routing, and saving with the unsaved mark and the close guard."
repository = "https://github.com/preset-nz/packages"
readme = "README.md"
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[lib]
name = "preset_app_kit"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
toml = "0.9"
# The `models` feature: streamed SHA-256 and a blocking HTTP client.
sha2 = { version = "0.10", optional = true }
# TLS is the OS stack via native-tls (Security.framework, SChannel, OpenSSL). The rustls options
# bundle webpki roots (CDLA-Permissive-2.0, outside the permissive policy); ureq 3.4's
# `native-tls-no-default` builds no TLS connector (it panics on https); minreq has only a
# whole-request timeout. reqwest's blocking timeout is per read, so a stall can't hang a cancel.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"], optional = true }

[features]
default = []
models = ["dep:sha2", "dep:reqwest"]

[dev-dependencies]
tempfile = "3"
# A mock runtime for the models commands and event tests.
tauri = { version = "2", default-features = false, features = ["test"] }
