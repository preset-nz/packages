# Thin hooks; `just` recipes are the source of truth.
# Convention: ~/rhizomatic-preset/guidance/runbooks/pre-commit-hooks.md
# Each package keeps its own biome.json and Rust edition, so the staged-file
# hooks run per package (`root:` runs inside the folder, on its files only).

pre-commit:
  parallel: true
  commands:
    biome-app-kit:
      root: "app-kit/"
      glob: "*.{ts,tsx,json}"
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}
    biome-facets:
      root: "facets/"
      glob: "*.{ts,tsx,json}"
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}
    biome-math:
      root: "math/"
      glob: "*.{ts,tsx,json}"
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}
    biome-preferences:
      root: "preferences/"
      glob: "*.{ts,tsx,json}"
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}
    biome-rhizome:
      root: "rhizome/"
      glob: "*.{ts,tsx,json}"
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}
    biome-ux-kit:
      root: "ux-kit/"
      glob: "*.{ts,tsx,json}"
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}
    rustfmt-app-kit:
      root: "app-kit/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    rustfmt-math:
      root: "math/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    rustfmt-preferences:
      root: "preferences/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    rustfmt-preset-docs:
      root: "preset-docs/"
      glob: "*.rs"
      run: rustfmt --edition 2024 --check {staged_files}
    rustfmt-rhizome:
      root: "rhizome/"
      glob: "*.rs"
      run: rustfmt --edition 2024 --check {staged_files}

pre-push:
  commands:
    check:
      run: just check-changed

# Conventional Commits, subject ≤ 72. knope reads the types to version releases,
# and the scope to pick the package: feat(facets): …, fix(rhizome): …
# How to write one: the write-conventional-commit skill.
commit-msg:
  commands:
    conventional:
      run: |
        s=$(head -n1 {1})
        printf '%s' "$s" | grep -qE '^((feat|fix|perf|refactor|style|test|docs|build|ci|chore|revert|release)(\([a-z0-9-]+\))?!?: [^ ]|Merge |Revert ")' \
          || { echo "commit-msg: subject must be 'type(scope): subject' (feat, fix, perf, refactor, style, test, docs, build, ci, chore, revert)"; exit 1; }
        [ ${#s} -le 72 ] || { echo "commit-msg: subject is ${#s} characters; keep it to 72 and put the why in the body"; exit 1; }
        # A commit knope releases (feat, fix, perf, or anything breaking) names one
        # package as its scope; a feat with no scope would release every package.
        if printf '%s' "$s" | grep -qE '^(feat|fix|perf)(\(|!|:)|^[a-z]+(\([^)]*\))?!: ' || grep -q '^BREAKING[ -]CHANGE: ' {1}; then
          scope=$(printf '%s' "$s" | sed -nE 's/^[a-z]+\(([^)]*)\)!?: .*/\1/p')
          scripts/packages.sh | grep -qxF -- "$scope" \
            || { echo "commit-msg: name one package as the scope, e.g. feat(facets): schema — …; scopes: $(scripts/packages.sh | tr '\n' ' ')"; echo "  A change to two packages is two commits."; exit 1; }
        fi
