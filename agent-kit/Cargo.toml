[package]
name = "preset-agent-kit"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "A local-first agent for a desktop app: an OpenAI-compatible streaming client, the tool loop with its limits, commands shown to a model as tools, and a run log."
repository = "https://github.com/preset-nz/packages"
readme = "README.md"
keywords = ["agent", "llm", "tools", "lm-studio", "local-first"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[lib]
name = "preset_agent_kit"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false }
